name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v5

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-cicd:${{ github.sha }} .

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/flask-cicd:${{ github.sha }}

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

    - name: Configure Kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

    - name: Deploy
      run: |
        kubectl set image deployment/flask-app \
        flask-app=${{ secrets.DOCKER_USERNAME }}/flask-cicd:${{ github.sha }}
