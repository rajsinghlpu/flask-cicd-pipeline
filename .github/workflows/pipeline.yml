name: CI-CD Pipeline

on:
  push:
    branches:
      - main


env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/flask-cicd


jobs:


  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Docker Image
      shell: bash
      run: |
        docker build \
          -t $IMAGE_NAME:${{ github.sha }} \
          -t $IMAGE_NAME:latest .


    - name: Push Docker Image
      shell: bash
      run: |
        docker push $IMAGE_NAME:${{ github.sha }}
        docker push $IMAGE_NAME:latest




  deploy:

    needs: build-and-push

    runs-on:
      - self-hosted
      - windows


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Setup kubectl
      uses: azure/setup-kubectl@v4



    - name: Configure Kubernetes (kind)
      shell: powershell
      run: |

        mkdir $HOME\.kube -Force

        kind export kubeconfig --name kind



    - name: Verify Kubernetes Access
      shell: powershell
      run: |

        kubectl config current-context
        kubectl get nodes
        kubectl get pods



    - name: Update Deployment Image
      shell: powershell
      run: |

        kubectl set image deployment/flask-app `
        flask-app=${{ secrets.DOCKER_USERNAME }}/flask-cicd:${{ github.sha }}



    - name: Wait For Rollout
      shell: powershell
      run: |

        kubectl rollout status deployment/flask-app --timeout=180s



    - name: Verify Deployment
      shell: powershell
      run: |

        kubectl get deployment flask-app
        kubectl get pods