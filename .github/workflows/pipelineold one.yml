name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-cicd:${{ github.sha }} .

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/flask-cicd:${{ github.sha }}


  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup kubectl
      uses: azure/setup-kubectl@v4


    - name: Configure Kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config


    - name: Check Cluster
      run: |
        kubectl get nodes
        kubectl get pods


    - name: Deploy
      run: |
        kubectl set image deployment/flask-app \
        flask-app=${{ secrets.DOCKER_USERNAME }}/flask-cicd:${{ github.sha }}

        kubectl rollout status deployment/flask-app --timeout=120s
